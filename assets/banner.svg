  </g>
  <rect x="818" y="88" width="366" height="192" rx="16" fill="#161d26" stroke="#2b3948"/>
  <circle cx="844" cy="112" r="5" fill="#54d5bb"/><circle cx="862" cy="112" r="5" fill="#596674"/><circle cx="880" cy="112" r="5" fill="#596674"/>
  <g font-family="monospace" font-size="18">
