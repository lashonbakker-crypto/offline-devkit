<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Offline DevKit</title>
  <desc id="description">Local files, clear answers. JSON, duplicates and directory sizes. Python standard library.</desc>
