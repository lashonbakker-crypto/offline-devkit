  <rect x="48" y="48" width="7" height="264" rx="3" fill="#54d5bb"/>
  <text x="88" y="93" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="4" fill="#54d5bb">BUILD SMALL · SHARE USEFUL</text>
  <text x="88" y="170" font-family="Arial, sans-serif" font-size="66" font-weight="bold" fill="#f0f6fc">Offline DevKit</text>
  <text x="90" y="217" font-family="Arial, sans-serif" font-size="25" fill="#9da7b3">Local files. Clear answers.</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#d7e0e9">
