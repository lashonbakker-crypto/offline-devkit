name: Release portable download

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_zipapp.py
          python dist/offline-devkit.pyz --version
          python dist/offline-devkit.pyz jsonl examples/records.jsonl --json
          python -c "import hashlib; from pathlib import Path; p=Path('dist/offline-devkit.pyz'); Path('dist/SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  offline-devkit.pyz\n', encoding='utf-8')"
          echo "RELEASE_TAG=v$(python -c 'from offline_devkit import __version__; print(__version__)')" >> "$GITHUB_ENV"
      - name: Publish tested archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; existing tags and assets will not be overwritten."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/offline-devkit.pyz dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Offline DevKit $RELEASE_TAG · JSONL checks & portable download" --notes-file "$notes" --latest
