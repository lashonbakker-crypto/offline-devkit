name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check README first-run demo
        run: python scripts/try_jsonl.py
      - name: Verify JSON defaults comparison
        run: python scripts/compare_json_checks.py
      - name: Verify copied consumer CI recipe
        run: python scripts/verify_ci_recipe.py
      - name: Verify synthetic size-report benchmark
        run: python scripts/benchmark_size_report.py --counts 1000 --top 10 --repeats 1
      - name: Check documented Bash pipelines
        if: runner.os != 'Windows'
        run: python scripts/verify_jsonl_pipelines.py --shell bash
      - name: Check documented PowerShell pipelines
        if: runner.os == 'Windows'
        run: python scripts/verify_jsonl_pipelines.py --shell powershell
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Smoke test installed command
        run: |
          offline-devkit --version
          offline-devkit json examples/config.json --check
          offline-devkit jsonl examples/records.jsonl --json
          offline-devkit dupes examples/files --json
          offline-devkit sizes examples/files --top 3 --json
      - name: Build and check portable archive
        run: |
          python scripts/build_zipapp.py
          python dist/offline-devkit.pyz --version
          python dist/offline-devkit.pyz jsonl examples/records.jsonl --json
          python -c "import gzip; from pathlib import Path; Path('dist/records.jsonl.gz').write_bytes(gzip.compress(Path('examples/records.jsonl').read_bytes(), mtime=0))"
          offline-devkit jsonl dist/records.jsonl.gz --gzip --json
          python dist/offline-devkit.pyz jsonl dist/records.jsonl.gz --gzip --json
          python scripts/try_jsonl.py --archive dist/offline-devkit.pyz
