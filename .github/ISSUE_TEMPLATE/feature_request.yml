name: Feature request / 功能建议
description: 描述一个具体场景和预期结果。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的实际问题
      description: 当前什么操作困难？请提供一个具体例子。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望的行为
      description: 输入、输出和成功标准；是否需要文件写入或第三方依赖？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的方案
